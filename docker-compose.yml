name: claudio

services:
  dockerd-isolated:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - dind-internal-cache:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 2s
      timeout: 2s
      retries: 30

  claude:
    build:
      context: .
      args:
        MISE_ENV: ${MISE_ENV:-}
    depends_on:
      dockerd-isolated:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://dockerd-isolated:2375
      - CLAUDE_CONFIG_DIR=/home/ubuntu/.claude
      - TZ=${TZ:-UTC}
    volumes:
      - config:/home/ubuntu/.config
      - claude:/home/ubuntu/.claude
      - gitconfig:/home/ubuntu/.gitconfig
      - gitignore:/home/ubuntu/.gitignore
      - ${PWD}:/workspace
    stdin_open: true
    tty: true

volumes:
  config:
  claude:
  gitconfig:
  gitignore:
  dind-internal-cache:
